<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#238636"/>
      <stop offset="100%" style="stop-color:#2ea043"/>
    </linearGradient>
    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f6feb"/>
      <stop offset="100%" style="stop-color:#58a6ff"/>
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6e40c9"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0883e"/>
      <stop offset="100%" style="stop-color:#e3b341"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#238636;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#3fb950;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#238636;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="exhaust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0883e"/>
      <stop offset="40%" style="stop-color:#e3b341"/>
      <stop offset="100%" style="stop-color:#e3b341;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-wide">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="900" height="400" rx="12"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" rx="12" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#21262d" stroke-width="0.5" opacity="0.4" clip-path="url(#clip)">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="350" x2="900" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
  </g>

  <!-- Scanning pulse -->
  <rect x="0" y="0" width="300" height="2" rx="1" fill="url(#pulse-grad)" clip-path="url(#clip)">
    <animateTransform attributeName="transform" type="translate" from="-300 198" to="1200 198" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══ ROCKET ICON (left side) ═══ -->
  <g transform="translate(75, 30)" filter="url(#glow-strong)">
    <!-- Nose cone -->
    <path d="M38 10 L48 40 L28 40 Z" fill="#3fb950"/>
    <!-- Body -->
    <rect x="28" y="40" width="20" height="50" rx="2" fill="#238636"/>
    <!-- Window -->
    <circle cx="38" cy="55" r="6" fill="#0d1117" opacity="0.7"/>
    <circle cx="38" cy="55" r="3" fill="#3fb950" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Fins -->
    <path d="M28 75 L18 95 L28 90 Z" fill="#2ea043"/>
    <path d="M48 75 L58 95 L48 90 Z" fill="#2ea043"/>
    <!-- Exhaust -->
    <ellipse cx="38" cy="95" rx="8" ry="15" fill="url(#exhaust)" opacity="0.8">
      <animate attributeName="ry" values="12;20;12" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="0.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="38" cy="98" rx="4" ry="8" fill="#e3b341" opacity="0.6">
      <animate attributeName="ry" values="6;12;6" dur="0.6s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Exhaust particles -->
    <circle cx="34" cy="108" r="1.5" fill="#e3b341" opacity="0">
      <animate attributeName="cy" values="100;130" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="108" r="1" fill="#f0883e" opacity="0">
      <animate attributeName="cy" values="102;125" dur="0.9s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0.6;0" dur="0.9s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="38" cy="108" r="1.5" fill="#e3b341" opacity="0">
      <animate attributeName="cy" values="103;135" dur="1.1s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.7;0" dur="1.1s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>

  <!-- Divider -->
  <line x1="160" y1="20" x2="160" y2="195" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="188" y="68" font-family="'SF Mono', 'Fira Code', monospace" font-size="52" font-weight="700" fill="#f0f6fc" letter-spacing="-1">TAEM</text>

  <!-- Subtitle -->
  <text x="190" y="95" font-family="'SF Mono', 'Fira Code', monospace" font-size="15" fill="#8b949e" letter-spacing="0.5">Mission Control Preflight System</text>

  <!-- Tagline -->
  <text x="190" y="118" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#6e7681" letter-spacing="0.3">Structure first, then judgment. No code before the gate clears.</text>

  <!-- Green accent bar -->
  <rect x="188" y="128" width="0" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" from="0" to="520" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- Feature pills row 1 -->
  <g transform="translate(188, 148)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#238636" opacity="0.15" stroke="#238636" stroke-width="1"/>
    <text x="60" y="16" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#3fb950" text-anchor="middle">15 Controllers</text>

    <rect x="128" y="0" width="106" height="24" rx="12" fill="#1f6feb" opacity="0.15" stroke="#1f6feb" stroke-width="1"/>
    <text x="181" y="16" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#58a6ff" text-anchor="middle">7 Phases</text>

    <rect x="242" y="0" width="136" height="24" rx="12" fill="#6e40c9" opacity="0.15" stroke="#6e40c9" stroke-width="1"/>
    <text x="310" y="16" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#bc8cff" text-anchor="middle">42 Constraints</text>

    <rect x="386" y="0" width="134" height="24" rx="12" fill="#b08800" opacity="0.15" stroke="#9e6a03" stroke-width="1"/>
    <text x="453" y="16" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#e3b341" text-anchor="middle">Go + Qdrant + Git</text>
  </g>

  <!-- Corner badge -->
  <rect x="818" y="12" width="70" height="22" rx="11" fill="#0d1117" stroke="#238636" stroke-width="1"/>
  <text x="853" y="27" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#3fb950" text-anchor="middle">v0.0.1</text>

  <!-- ═══ PHASE TIMELINE (middle section) ═══ -->

  <!-- Section divider -->
  <rect x="30" y="200" width="840" height="1" fill="#21262d"/>

  <!-- Phase pipeline -->
  <g transform="translate(0, 218)">
    <!-- Phase labels and boxes -->
    <!-- Phase 00 -->
    <rect x="32" y="0" width="94" height="44" rx="6" fill="#238636" opacity="0.1" stroke="#238636" stroke-width="1"/>
    <text x="79" y="16" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#3fb950" text-anchor="middle" font-weight="700">PHASE 00</text>
    <text x="79" y="28" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#8b949e" text-anchor="middle">PAD CHECK</text>
    <text x="79" y="39" font-family="'SF Mono', 'Fira Code', monospace" font-size="7" fill="#6e7681" text-anchor="middle">GC DPS EECOM</text>
    <!-- Connector -->
    <line x1="126" y1="22" x2="140" y2="22" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="133" cy="22" r="2" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="cx" from="126" to="140" dur="3s" repeatCount="indefinite" begin="0s"/>
    </circle>

    <!-- Phase 01 -->
    <rect x="140" y="0" width="94" height="44" rx="6" fill="#238636" opacity="0.1" stroke="#238636" stroke-width="1"/>
    <text x="187" y="16" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#3fb950" text-anchor="middle" font-weight="700">PHASE 01</text>
    <text x="187" y="28" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#8b949e" text-anchor="middle">CORPUS</text>
    <text x="187" y="39" font-family="'SF Mono', 'Fira Code', monospace" font-size="7" fill="#6e7681" text-anchor="middle">NAV FAO</text>
    <line x1="234" y1="22" x2="248" y2="22" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="241" cy="22" r="2" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="cx" from="234" to="248" dur="3s" repeatCount="indefinite" begin="0.4s"/>
    </circle>

    <!-- Phase 02 -->
    <rect x="248" y="0" width="94" height="44" rx="6" fill="#1f6feb" opacity="0.1" stroke="#1f6feb" stroke-width="1"/>
    <text x="295" y="16" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#58a6ff" text-anchor="middle" font-weight="700">PHASE 02</text>
    <text x="295" y="28" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#8b949e" text-anchor="middle">ARCH SURVEY</text>
    <text x="295" y="39" font-family="'SF Mono', 'Fira Code', monospace" font-size="7" fill="#6e7681" text-anchor="middle">ARCH CDS PCO</text>
    <line x1="342" y1="22" x2="356" y2="22" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="349" cy="22" r="2" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="cx" from="342" to="356" dur="3s" repeatCount="indefinite" begin="0.8s"/>
    </circle>

    <!-- Phase 03 -->
    <rect x="356" y="0" width="94" height="44" rx="6" fill="#1f6feb" opacity="0.1" stroke="#1f6feb" stroke-width="1"/>
    <text x="403" y="16" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#58a6ff" text-anchor="middle" font-weight="700">PHASE 03</text>
    <text x="403" y="28" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#8b949e" text-anchor="middle">PLAN</text>
    <text x="403" y="39" font-family="'SF Mono', 'Fira Code', monospace" font-size="7" fill="#6e7681" text-anchor="middle">INCO</text>
    <line x1="450" y1="22" x2="464" y2="22" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="457" cy="22" r="2" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="1.2s"/>
      <animate attributeName="cx" from="450" to="464" dur="3s" repeatCount="indefinite" begin="1.2s"/>
    </circle>

    <!-- Phase 04 — PRB gate (highlighted) -->
    <rect x="464" y="0" width="118" height="44" rx="6" fill="#6e40c9" opacity="0.15" stroke="#6e40c9" stroke-width="1.5"/>
    <text x="523" y="16" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#bc8cff" text-anchor="middle" font-weight="700">PHASE 04</text>
    <text x="523" y="28" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#8b949e" text-anchor="middle">PRB GATE</text>
    <text x="523" y="39" font-family="'SF Mono', 'Fira Code', monospace" font-size="7" fill="#6e7681" text-anchor="middle">SEC TRC SKP COR ADR</text>
    <!-- Gate pulse on Phase 04 border -->
    <rect x="464" y="0" width="118" height="44" rx="6" fill="none" stroke="#bc8cff" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <line x1="582" y1="22" x2="596" y2="22" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="589" cy="22" r="2" fill="#bc8cff" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="1.6s"/>
      <animate attributeName="cx" from="582" to="596" dur="3s" repeatCount="indefinite" begin="1.6s"/>
    </circle>

    <!-- Phase 05 -->
    <rect x="596" y="0" width="94" height="44" rx="6" fill="#238636" opacity="0.1" stroke="#238636" stroke-width="1"/>
    <text x="643" y="16" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#3fb950" text-anchor="middle" font-weight="700">PHASE 05</text>
    <text x="643" y="28" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#8b949e" text-anchor="middle">CAPCOM</text>
    <text x="643" y="39" font-family="'SF Mono', 'Fira Code', monospace" font-size="7" fill="#6e7681" text-anchor="middle">DEV OUTPUT</text>
    <line x1="690" y1="22" x2="704" y2="22" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="697" cy="22" r="2" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="2.0s"/>
      <animate attributeName="cx" from="690" to="704" dur="3s" repeatCount="indefinite" begin="2.0s"/>
    </circle>

    <!-- Phase 06 -->
    <rect x="704" y="0" width="94" height="44" rx="6" fill="#238636" opacity="0.1" stroke="#238636" stroke-width="1"/>
    <text x="751" y="16" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#3fb950" text-anchor="middle" font-weight="700">PHASE 06</text>
    <text x="751" y="28" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#8b949e" text-anchor="middle">DISPATCH</text>
    <text x="751" y="39" font-family="'SF Mono', 'Fira Code', monospace" font-size="7" fill="#6e7681" text-anchor="middle">PAO</text>

    <!-- LANDED indicator -->
    <text x="820" y="18" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#3fb950" text-anchor="middle" font-weight="700" filter="url(#glow)">✓</text>
    <text x="845" y="18" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#3fb950" text-anchor="middle" font-weight="700">LANDED</text>
    <text x="833" y="36" font-family="'SF Mono', 'Fira Code', monospace" font-size="7" fill="#6e7681" text-anchor="middle">~30-45s</text>
  </g>

  <!-- "Zero LLM" bracket under phases 00-03 -->
  <g transform="translate(0, 270)">
    <line x1="50" y1="0" x2="440" y2="0" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="245" y="14" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#6e7681" text-anchor="middle">← Phases 00–03: zero LLM calls, fully offline →</text>
  </g>

  <!-- ═══ REPO ARCHITECTURE (bottom section) ═══ -->

  <rect x="30" y="292" width="840" height="1" fill="#21262d"/>

  <!-- 4 repo boxes -->
  <g transform="translate(0, 305)">
    <!-- taem (green) -->
    <rect x="32" y="0" width="196" height="52" rx="6" fill="#238636" opacity="0.08" stroke="#238636" stroke-width="1"/>
    <circle cx="48" cy="16" r="4" fill="#3fb950" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="20" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#3fb950" font-weight="700">taem</text>
    <text x="48" y="34" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#8b949e">Go kernel • gate state machine</text>
    <text x="48" y="46" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#6e7681">15 controllers • inference router</text>

    <!-- Arrow taem → adrs -->
    <line x1="228" y1="18" x2="244" y2="18" stroke="#30363d" stroke-width="1"/>
    <polygon points="242,15 248,18 242,21" fill="#30363d"/>

    <!-- adrs (blue) -->
    <rect x="248" y="0" width="196" height="52" rx="6" fill="#1f6feb" opacity="0.08" stroke="#1f6feb" stroke-width="1"/>
    <circle cx="264" cy="16" r="4" fill="#58a6ff" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <text x="274" y="20" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#58a6ff" font-weight="700">adrs</text>
    <text x="264" y="34" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#8b949e">8 ADRs • 42 constraints</text>
    <text x="264" y="46" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#6e7681">machine-checkable YAML</text>

    <!-- Arrow taem → ecosystem -->
    <line x1="130" y1="52" x2="130" y2="52" stroke="none"/>

    <!-- ecosystem (purple) -->
    <rect x="464" y="0" width="196" height="52" rx="6" fill="#6e40c9" opacity="0.08" stroke="#6e40c9" stroke-width="1"/>
    <circle cx="480" cy="16" r="4" fill="#bc8cff" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" begin="1.0s"/>
    </circle>
    <text x="490" y="20" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#bc8cff" font-weight="700">ecosystem</text>
    <text x="480" y="34" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#8b949e">Qdrant • 5 collections</text>
    <text x="480" y="46" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#6e7681">semantic memory layer</text>

    <!-- Arrow between -->
    <line x1="444" y1="18" x2="460" y2="18" stroke="#30363d" stroke-width="1"/>
    <polygon points="458,15 464,18 458,21" fill="#30363d"/>

    <!-- mc-state (orange) -->
    <rect x="680" y="0" width="188" height="52" rx="6" fill="#f0883e" opacity="0.08" stroke="#9e6a03" stroke-width="1"/>
    <circle cx="696" cy="16" r="4" fill="#e3b341" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <text x="706" y="20" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#e3b341" font-weight="700">mc-state</text>
    <text x="696" y="34" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#8b949e">git-first • JSONL signals</text>
    <text x="696" y="46" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#6e7681">append-only state store</text>

    <!-- Arrow between -->
    <line x1="660" y1="18" x2="676" y2="18" stroke="#30363d" stroke-width="1"/>
    <polygon points="674,15 680,18 674,21" fill="#30363d"/>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="370" width="900" height="30" rx="0" fill="#161b22" opacity="0.9" clip-path="url(#clip)"/>
  <rect x="0" y="370" width="900" height="1" fill="#30363d"/>

  <circle cx="40" cy="385" r="4" fill="#3fb950" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="52" y="389" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#8b949e">NASA-inspired preflight  •  structure before code  •  gate protocol  •  Ollama-first inference  •  git-native state</text>
</svg>
